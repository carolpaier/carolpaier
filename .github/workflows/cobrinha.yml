name: Generate Datas

on:
  schedule: # executa a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      # Pac-Man percorrendo o gráfico de contribuições.
      # Usa o fork carolpaier/pacman-contribution-graph (branch sem-telemetria), fixado por commit.
      - uses: carolpaier/pacman-contribution-graph@7316eeb21aaf99599c0fe8d29ce7ece47c8e2363
        with:
          github_user_name: carolpaier

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
